# ClamAV daemon tuned for a 2 GB server: no second copy of the virus database during updates
# (halves peak memory; scanning pauses ~30 s while it reloads).
LogFile /var/log/clamav/clamd.log
LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav
ConcurrentDatabaseReload no
StreamMaxLength 25M
MaxFileSize 25M
MaxScanSize 100M
